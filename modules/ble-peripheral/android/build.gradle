plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.ybbarng.skytalk'
version = '1.0.0'

android {
  namespace 'com.ybbarng.skytalk.bleperipheral'

  // expo-module-gradle-plugin 이 이 둘을 요구한다. 없으면 설정 단계에서 멎는다.
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}
