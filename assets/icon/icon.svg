<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    Skywalkie 아이콘.

    닫힌 편지봉투 위에 실링을 찍듯 주황 여객기를 얹었다.
    "말을 봉투에 담아 비행기로 보낸다" 는 뜻이다. 밤하늘 바탕(bg)에
    종이는 크림색, 실링은 기내 조명 주황(me)이다.

    작게(48px) 줄여도 봉투와 실링이 남아야 하므로 요소를 크게, 선을 굵게
    그린다. 비행기는 봉투 높이의 60% 쯤이다.
    (docs/07-design-system.md 7장)
  -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A2138"/>
      <stop offset="100%" stop-color="#0B1020"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF6EA"/>
      <stop offset="100%" stop-color="#EEDFC8"/>
    </linearGradient>
    <linearGradient id="flap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7EAD6"/>
      <stop offset="100%" stop-color="#E3D0B4"/>
    </linearGradient>
    <radialGradient id="wax" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0%" stop-color="#FF9D5C"/>
      <stop offset="70%" stop-color="#E0702A"/>
      <stop offset="100%" stop-color="#B85418"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#sky)"/>

  <!-- 창밖의 별 몇 개 -->
  <circle cx="196" cy="212" r="7" fill="#5CC8FF" opacity="0.5"/>
  <circle cx="838" cy="264" r="5" fill="#5CC8FF" opacity="0.36"/>
  <circle cx="812" cy="806" r="6" fill="#5CC8FF" opacity="0.3"/>
  <circle cx="236" cy="836" r="4" fill="#5CC8FF" opacity="0.28"/>

  <!-- 봉투 몸통 -->
  <rect x="172" y="277" width="680" height="470" rx="30" fill="url(#paper)"/>
  <!-- 뒤로 접힌 아랫자락. 봉투임을 알려주는 두 사선 -->
  <path d="M188 736 L512 520 L836 736" fill="none" stroke="#C9B18F" stroke-width="16" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- 뚜껑. 위에서 내려와 가운데서 만난다 -->
  <path d="M172 307 Q172 277 202 277 L822 277 Q852 277 852 307 L512 590 Z" fill="url(#flap)"/>
  <path d="M176 300 L512 590 L848 300" fill="none" stroke="#B9A07C" stroke-width="16" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- 봉투 위에 실링처럼 얹은 여객기. 위에서 본 모습이고 코가 오른쪽을 향한다 -->
  <g transform="translate(512 560) rotate(90) scale(1.7)">
    <path d="M0 -82 C14 -82 22 -62 22 -40 L22 -14 L80 26 L80 42 L22 22 L22 50 L44 68 L44 82 L10 74 L0 84 L-10 74 L-44 82 L-44 68 L-22 50 L-22 22 L-80 42 L-80 26 L-22 -14 L-22 -40 C-22 -62 -14 -82 0 -82 Z" fill="#0B1020" opacity="0.28" transform="translate(5 5)"/>
    <path d="M0 -82 C14 -82 22 -62 22 -40 L22 -14 L80 26 L80 42 L22 22 L22 50 L44 68 L44 82 L10 74 L0 84 L-10 74 L-44 82 L-44 68 L-22 50 L-22 22 L-80 42 L-80 26 L-22 -14 L-22 -40 C-22 -62 -14 -82 0 -82 Z" fill="url(#wax)"/>
  </g>
</svg>
