<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    아이폰 아이콘. 밤하늘 위 주황 여객기 옆모습. 두 창문이 켜져 있고 그 사이를
    크림색 봉투가 곡선을 그리며 날아간다. 떨어져 앉은 두 사람이 말을 주고받는
    그림이다. (docs/07-design-system.md 7장)
  -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E1B3A"/>
      <stop offset="100%" stop-color="#0B1020"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF9D5C"/>
      <stop offset="100%" stop-color="#D9661F"/>
    </linearGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B85418"/>
      <stop offset="100%" stop-color="#8F3E0E"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF6EA"/>
      <stop offset="100%" stop-color="#EEDFC8"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#FFF6EA" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#FFF6EA" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="fuse">
      <path d="M 170 560 Q 170 520 210 520 L 740 520 C 850 520 935 570 968 610 C 935 650 850 700 740 700 L 300 700 C 240 700 190 675 170 640 Z"/>
    </clipPath>
  </defs>
  <rect width="1024" height="1024" fill="url(#sky)"/>
  <!-- 별 -->
  <circle cx="150" cy="180" r="7" fill="#5CC8FF" opacity="0.5"/>
  <circle cx="700" cy="120" r="5" fill="#5CC8FF" opacity="0.4"/>
  <circle cx="900" cy="880" r="6" fill="#5CC8FF" opacity="0.3"/>
  <circle cx="120" cy="900" r="4" fill="#5CC8FF" opacity="0.3"/>
  <!-- 켜진 창문 뒤 빛 -->
  <circle cx="390" cy="604" r="120" fill="url(#glow)"/>
  <circle cx="702" cy="604" r="120" fill="url(#glow)"/>
  <!-- 꼬리 날개 -->
  <path d="M 230 660 L 120 740 L 215 740 L 320 660 Z" fill="#B85418"/>
  <path d="M 205 525 L 90 340 L 195 340 L 340 525 Z" fill="url(#paper)"/>
  <!-- 동체 -->
  <path d="M 170 560 Q 170 520 210 520 L 740 520 C 850 520 935 570 968 610 C 935 650 850 700 740 700 L 300 700 C 240 700 190 675 170 640 Z" fill="url(#body)"/>
  <rect x="150" y="662" width="840" height="60" fill="url(#belly)" clip-path="url(#fuse)"/>
  <!-- 조종석 창 -->
  <path d="M 846 548 L 882 548 C 915 560 940 585 952 606 L 846 606 Z" fill="#0B1020"/>
  <!-- 창문 줄 -->
  <g fill="#0B1020">
    <rect x="320" y="580" width="36" height="48" rx="12"/>
    <rect x="424" y="580" width="36" height="48" rx="12"/>
    <rect x="476" y="580" width="36" height="48" rx="12"/>
    <rect x="528" y="580" width="36" height="48" rx="12"/>
    <rect x="580" y="580" width="36" height="48" rx="12"/>
    <rect x="632" y="580" width="36" height="48" rx="12"/>
    <rect x="736" y="580" width="36" height="48" rx="12"/>
  </g>
  <!-- 켜진 창문 둘. 여기서 저기로 말이 건너간다 -->
  <rect x="372" y="580" width="36" height="48" rx="12" fill="#FFF6EA"/>
  <rect x="684" y="580" width="36" height="48" rx="12" fill="#FFF6EA"/>
  <!-- 주날개와 엔진 -->
  <path d="M 600 690 L 410 850 Q 430 870 500 870 L 770 690 Z" fill="#B85418"/>
  <ellipse cx="590" cy="822" rx="66" ry="32" fill="url(#paper)"/>
  <!-- 봉투가 지나온 길 -->
  <path d="M 390 570 C 380 260 712 260 702 570" fill="none" stroke="#FFF6EA" stroke-width="12" stroke-opacity="0.75" stroke-dasharray="6 30" stroke-linecap="round"/>
  <!-- 날아가는 봉투 -->
  <g transform="translate(546 330) rotate(-10)">
    <rect x="-80" y="-56" width="160" height="112" rx="16" fill="url(#paper)"/>
    <path d="M -80 -44 L 0 20 L 80 -44" fill="none" stroke="#B9A07C" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M -76 52 L -20 6 M 76 52 L 20 6" fill="none" stroke="#C9B18F" stroke-width="10" stroke-linecap="round"/>
  </g>
</svg>
