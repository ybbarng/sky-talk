<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    안드로이드 13부터 테마 색에 맞춰 칠하는 아이콘.
    모양만 있으면 되고 색은 시스템이 정한다. 봉투 윤곽 위에 여객기 실루엣을
    얹는다. 둘 다 같은 색으로 칠해지므로 비행기가 봉투 선을 덮어도 된다.
  -->
  <g fill="none" stroke="#000000" stroke-width="40" stroke-linejoin="round" stroke-linecap="round">
    <rect x="222" y="322" width="580" height="380" rx="28"/>
    <path d="M232 342 L512 560 L792 342"/>
  </g>
  <!-- 봉투 위에 실링처럼 얹은 여객기. 위에서 본 모습이고 코가 오른쪽을 향한다. 봉투 가로 가운데, 세로 55% 자리 -->
  <g transform="translate(518 530) scale(0.85)" fill="#000000" stroke="#000000" stroke-width="10" stroke-linejoin="round">
    <!-- 동체: 코가 둥글고 꼬리로 갈수록 가늘어진다 -->
    <path d="M180 0 C180 -14 168 -24 150 -24 L20 -24 C-40 -24 -120 -16 -178 -8 C-186 -6 -186 6 -178 8 C-120 16 -40 24 20 24 L150 24 C168 24 180 14 180 0 Z"/>
    <!-- 주날개 한 쌍. 뒤로 살짝 젖혔다 -->
    <path d="M62 -16 L-70 -168 L-114 -168 L-34 -16 Z"/>
    <path d="M62 16 L-70 168 L-114 168 L-34 16 Z"/>
    <!-- 꼬리날개 한 쌍 -->
    <path d="M-124 -8 L-172 -74 L-198 -74 L-160 -8 Z"/>
    <path d="M-124 8 L-172 74 L-198 74 L-160 8 Z"/>
  </g>
</svg>
