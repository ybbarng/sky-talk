<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    안드로이드 13부터 테마 색에 맞춰 칠하는 아이콘.
    모양만 있으면 되고 색은 시스템이 정한다. 봉투 윤곽과 실링 원이다.
    실링 안의 비행기는 진짜 구멍으로 판다. 흰색으로 그리면 시스템이 같은
    색으로 칠해 버려 사라진다.
  -->
  <defs>
    <mask id="seal">
      <circle cx="512" cy="572" r="118" fill="#FFFFFF"/>
      <g transform="translate(512 572) rotate(45)">
        <path d="M0 -70 L0 44 L-54 72 Z M0 -70 L54 72 L0 44 Z" fill="#000000"/>
      </g>
    </mask>
  </defs>
  <g fill="none" stroke="#000000" stroke-width="40" stroke-linejoin="round" stroke-linecap="round">
    <rect x="222" y="322" width="580" height="380" rx="28"/>
    <path d="M232 342 L512 560 L792 342"/>
  </g>
  <rect x="380" y="440" width="264" height="264" fill="#000000" mask="url(#seal)"/>
</svg>
